media:
  input: static/media
  output: /media
content:
  - name: articles-en
    label: Articles (English)
    type: collection
    path: content/en
    view:
      fields: [title, category, date, draft]
    fields:
      - name: id
        label: Article ID (use the same ID for the same article in every language)
        type: string
      - name: title
        label: Title
        type: string
      - name: description
        label: Meta description (aim for 120 to 160 characters)
        type: text
      - name: category
        label: Category
        type: select
        options:
          values: [money, text, images, internet]
      - name: tool
        label: Related tool
        type: select
        options:
          values: [loan, percent, words, image, pdf, speed]
      - name: date
        label: Date
        type: date
      - name: draft
        label: Draft (hidden from the site while on)
        type: boolean
      - name: body
        label: Text
        type: rich-text
